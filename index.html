<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Дела</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:var(--tg-theme-secondary-bg-color,#eaeeed);
  --card:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#13201c);
  --hint:var(--tg-theme-hint-color,#74827e);
  --accent:#1c8a70;
  --accent-soft:rgba(28,138,112,.13);
  --warn:#c2512f;
  --line:rgba(120,140,134,.22);
  color-scheme:light;
}
:root[data-scheme="dark"]{
  --accent:#4cc9a7;
  --accent-soft:rgba(76,201,167,.16);
  --warn:#f08a68;
  --line:rgba(150,170,164,.2);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--text);font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
#view{padding:20px 16px 8px;max-width:560px;margin:0 auto}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px;text-transform:capitalize}
.sub{color:var(--hint);font-size:14px;margin:0 0 20px}
h2{font-size:14px;font-weight:600;color:var(--hint);margin:24px 4px 8px}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .d{font-size:13px;color:var(--hint)}
.row .d.late{color:var(--warn)}
.row.done .t{color:var(--hint);text-decoration:line-through}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--hint);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:14px;height:14px;opacity:0;stroke:#fff}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{opacity:1}
.streak{flex:none;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.empty{padding:22px 16px;color:var(--hint);font-size:14px;text-align:center}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* habit card */
.habit{padding:16px;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .top{display:flex;align-items:flex-start;gap:12px}
.habit .name{flex:1;font-weight:600;font-size:17px;text-align:left;overflow-wrap:anywhere}
.habit .num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent);text-align:right}
.habit .num small{display:block;font-size:12px;font-weight:500;color:var(--hint);letter-spacing:0;margin-top:2px}
.week{display:flex;justify-content:space-between;margin-top:14px;gap:4px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--hint)}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center}
.dot.off{border-style:dashed;opacity:.5}
.dot.miss{border-color:var(--warn);opacity:.65}
.dot.ok{background:var(--accent);border-color:var(--accent)}
.dot.today{border-color:var(--text)}
.dot.ok.today{border-color:var(--accent)}
.dot svg{width:15px;height:15px;stroke:#fff}
.best{font-size:13px;color:var(--hint);margin-top:12px}

/* stats */
.stat{padding:16px}
.stat svg{width:100%;height:auto;display:block}
.bar{fill:var(--accent)}.bar0{fill:var(--line)}
.ax{fill:var(--hint);font-size:10px;font-family:inherit}
.val{fill:var(--text);font-size:11px;font-weight:600;font-family:inherit}
.hrow{padding:14px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hh{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:600}
.hrow .hh span:last-child{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.grid i{aspect-ratio:1;border-radius:4px;background:var(--line);opacity:.5}
.grid i.ok{background:var(--accent);opacity:1}
.grid i.miss{background:var(--warn);opacity:.45}
.grid i.na{opacity:.15}
.totals{display:flex;gap:10px}
.totals div{flex:1;padding:14px 16px}
.totals b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.totals span{font-size:13px;color:var(--hint)}

/* nav + fab */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--hint)}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
#fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}

/* sheet */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#shade.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:11;max-width:560px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;outline:0}
.field:focus{border-color:var(--accent)}
.lbl{display:block;font-size:13px;color:var(--hint);margin:14px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.two{display:flex;gap:10px}.two>*{flex:1}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--accent);color:#fff}
.btn.del{flex:none;background:transparent;color:var(--warn);border:1.5px solid var(--line);padding:14px 18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>

<button id="fab" aria-label="Добавить" data-act="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav>
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>Сегодня</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Задачи</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Привычки</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Итоги</button>
</nav>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<script>
/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const dark = tg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
const buzz = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

/* ---------- Хранилище: облако Telegram, запасной вариант localStorage ---------- */
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const memStore = {};
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } };
const csGet = keys => new Promise((ok, no) => CS.getItems(keys, (e, v) => e ? no(e) : ok(v)));
const csSet = (k, v) => new Promise((ok, no) => CS.setItem(k, v, (e, r) => e ? no(e) : ok(r)));
const csDel = keys => new Promise(ok => CS.removeItems(keys, () => ok()));
const CHUNK = 3500;
let savedChunks = 0;

async function loadData() {
  let raw = null;
  if (CS) {
    try {
      const n = parseInt((await csGet(['n'])).n || '0', 10);
      if (n > 0) {
        const keys = Array.from({ length: n }, (_, i) => 'd' + i);
        const vals = await csGet(keys);
        raw = keys.map(k => vals[k] || '').join('');
        savedChunks = n;
      }
    } catch (e) {}
  }
  if (!raw) raw = lsGet('tracker');
  try { const d = JSON.parse(raw); if (d && d.tasks && d.habits) return d; } catch (e) {}
  return { tasks: [], habits: [] };
}

let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(S);
    lsSet('tracker', json);
    if (!CS) return;
    try {
      const parts = [];
      for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
      for (let i = 0; i < parts.length; i++) await csSet('d' + i, parts[i]);
      await csSet('n', String(parts.length));
      if (savedChunks > parts.length) await csDel(Array.from({ length: savedChunks - parts.length }, (_, i) => 'd' + (parts.length + i)));
      savedChunks = parts.length;
    } catch (e) {}
  }, 400);
}

/* ---------- Даты ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const dow = s => (new Date(s + 'T00:00').getDay() + 6) % 7; // Пн = 0
const fmt = s => new Date(s + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

/* ---------- Логика привычек ---------- */
const scheduled = (h, d) => h.days.includes(dow(d));
function streak(h) {
  const t = today(); let s = 0, d = t;
  for (let i = 0; i < 800; i++) {
    if (d < h.created) break;
    if (scheduled(h, d)) {
      if (h.log[d]) s++;
      else if (d !== t) break;
    }
    d = addDays(d, -1);
  }
  return s;
}
function best(h) {
  let b = 0, c = 0, d = h.created; const t = today();
  while (d <= t) {
    if (scheduled(h, d)) {
      if (h.log[d]) { c++; b = Math.max(b, c); }
      else if (d !== t) c = 0;
    }
    d = addDays(d, 1);
  }
  return b;
}
function rate(h, n) {
  const t = today(); let sch = 0, ok = 0;
  for (let i = 0; i < n; i++) {
    const d = addDays(t, -i);
    if (d < h.created) break;
    if (!scheduled(h, d)) continue;
    if (d === t && !h.log[d]) continue;
    sch++; if (h.log[d]) ok++;
  }
  return sch ? Math.round(ok / sch * 100) : null;
}

/* ---------- Представления ---------- */
let S = { tasks: [], habits: [] };
let tab = 'today';

function dueLabel(t) {
  if (!t.due) return '';
  const td = today();
  const l = t.due === td ? 'сегодня' : t.due === addDays(td, 1) ? 'завтра' : t.due === addDays(td, -1) ? 'вчера' : fmt(t.due);
  return l + (t.time ? ', ' + t.time : '');
}
const isLate = t => !t.done && t.due && t.due < today();
const byDue = (a, b) => (a.due || '9') .localeCompare(b.due || '9') || (a.time || '99').localeCompare(b.time || '99');

function taskRow(t) {
  const d = dueLabel(t);
  return `<div class="row ${t.done ? 'done' : ''}">
    <button class="chk ${t.done ? 'on' : ''}" data-act="tt" data-id="${t.id}" aria-label="Отметить">${CHECK}</button>
    <button class="body" data-act="et" data-id="${t.id}"><div class="t">${esc(t.title)}</div>${d ? `<div class="d ${isLate(t) ? 'late' : ''}">${d}</div>` : ''}</button>
  </div>`;
}
function habitRow(h) {
  const t = today(), on = !!h.log[t], s = streak(h);
  return `<div class="row">
    <button class="chk ${on ? 'on' : ''}" data-act="th" data-id="${h.id}" aria-label="Отметить">${CHECK}</button>
    <button class="body" data-act="eh" data-id="${h.id}"><div class="t">${esc(h.title)}</div>${h.time ? `<div class="d">${h.time}</div>` : ''}</button>
    ${s ? `<span class="streak">${s} подряд</span>` : ''}
  </div>`;
}
const list = (items, fn, empty) => `<div class="card">${items.length ? items.map(fn).join('') : `<div class="empty">${empty}</div>`}</div>`;

function todayView() {
  const t = today();
  const hs = S.habits.filter(h => scheduled(h, t));
  const ts = S.tasks.filter(x => !x.done && x.due && x.due <= t).sort(byDue);
  const doneH = hs.filter(h => h.log[t]).length;
  const doneT = S.tasks.filter(x => x.doneAt === t).length;
  const total = hs.length + ts.length + doneT, done = doneH + doneT;
  const pct = total ? Math.round(done / total * 100) : 0;
  const head = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<h1>${head}</h1>
    <p class="sub">${total ? `Сделано ${done} из ${total}` : 'На сегодня ничего не запланировано'}</p>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <h2>Привычки</h2>${list(hs, habitRow, 'Нет привычек на сегодня. Добавь их во вкладке «Привычки».')}
    <h2>Задачи на сегодня и просроченные</h2>${list(ts, taskRow, 'Свободно. Нажми +, чтобы добавить задачу.')}`;
}
function tasksView() {
  const t = today(), open = S.tasks.filter(x => !x.done);
  const late = open.filter(x => x.due && x.due < t).sort(byDue);
  const now = open.filter(x => x.due === t).sort(byDue);
  const next = open.filter(x => x.due && x.due > t).sort(byDue);
  const none = open.filter(x => !x.due);
  const done = S.tasks.filter(x => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')).slice(0, 10);
  const sec = (title, a) => a.length ? `<h2>${title}</h2>${list(a, taskRow)}` : '';
  const any = S.tasks.length;
  return `<h1>Задачи</h1><p class="sub">${open.length ? `Открыто: ${open.length}` : 'Всё сделано'}</p>
    ${any ? '' : '<div class="card"><div class="empty">Задач пока нет. Нажми +, чтобы добавить первую.</div></div>'}
    ${sec('Просрочено', late)}${sec('Сегодня', now)}${sec('Дальше', next)}${sec('Без срока', none)}${sec('Недавно выполнено', done)}`;
}
function weekStrip(h) {
  const t = today();
  return `<div class="week">${Array.from({ length: 7 }, (_, i) => {
    const d = addDays(t, i - 6), sch = scheduled(h, d), ok = !!h.log[d];
    const cls = ok ? 'ok' : !sch ? 'off' : d < t ? 'miss' : '';
    return `<div class="day"><button class="dot ${cls} ${d === t ? 'today' : ''}" data-act="dh" data-id="${h.id}" data-date="${d}" aria-label="${fmt(d)}">${ok ? CHECK : ''}</button>${WD[dow(d)]}</div>`;
  }).join('')}</div>`;
}
function habitsView() {
  const cards = S.habits.map(h => {
    const s = streak(h), b = best(h);
    return `<div class="habit"><div class="top">
      <button class="name" data-act="eh" data-id="${h.id}">${esc(h.title)}</button>
      <div class="num">${s}<small>подряд</small></div></div>
      ${weekStrip(h)}<div class="best">Рекорд: ${b}${h.time ? `, напоминание в ${h.time}` : ''}</div></div>`;
  }).join('');
  return `<h1>Привычки</h1><p class="sub">${S.habits.length ? 'Нажми на кружок, чтобы отметить день' : 'Привычек пока нет'}</p>
    <div class="card">${cards || '<div class="empty">Нажми +, чтобы завести первую привычку.</div>'}</div>`;
}
function statsView() {
  const t = today();
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const counts = days.map(d => S.tasks.filter(x => x.doneAt === d).length);
  const max = Math.max(3, ...counts);
  const bars = counts.map((c, i) => {
    const h = Math.max(Math.round(c / max * 64), 3), x = i * 40 + 8;
    return `<rect x="${x}" y="${82 - h}" width="24" height="${h}" rx="7" class="${c ? 'bar' : 'bar0'}"/>
      <text x="${x + 12}" y="98" text-anchor="middle" class="ax">${WD[dow(days[i])]}</text>
      ${c ? `<text x="${x + 12}" y="${76 - h}" text-anchor="middle" class="val">${c}</text>` : ''}`;
  }).join('');
  const week = counts.reduce((a, b) => a + b, 0);
  const grid = h => Array.from({ length: 28 }, (_, i) => {
    const d = addDays(t, i - 27);
    const c = d < h.created ? 'na' : h.log[d] ? 'ok' : scheduled(h, d) && d < t ? 'miss' : 'na';
    return `<i class="${c}"></i>`;
  }).join('');
  const hrows = S.habits.map(h => {
    const r = rate(h, 28);
    return `<div class="hrow"><div class="hh"><span>${esc(h.title)}</span><span>${r === null ? 'нет данных' : r + '%'}</span></div><div class="grid">${grid(h)}</div></div>`;
  }).join('');
  const totalDone = S.tasks.filter(x => x.done).length;
  const topStreak = S.habits.reduce((m, h) => Math.max(m, streak(h)), 0);
  return `<h1>Итоги</h1><p class="sub">За неделю выполнено задач: ${week}</p>
    <div class="card stat"><svg viewBox="0 0 288 104" role="img" aria-label="Выполненные задачи за 7 дней">${bars}</svg></div>
    <h2>Привычки за 28 дней</h2>
    <div class="card">${hrows || '<div class="empty">Появятся, когда заведёшь привычки.</div>'}</div>
    <h2>Всего</h2>
    <div class="totals"><div class="card"><b>${totalDone}</b><span>задач выполнено</span></div><div class="card"><b>${topStreak}</b><span>лучшая текущая серия</span></div></div>`;
}
const views = { today: todayView, tasks: tasksView, habits: habitsView, stats: statsView };

function render() {
  $('#view').innerHTML = views[tab]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').style.display = tab === 'stats' ? 'none' : 'flex';
}

/* ---------- Форма добавления / правки ---------- */
let form = null;
function openSheet(kind, item) {
  const t = today();
  if (kind === 'task') form = { kind, id: item ? item.id : null, due: item ? item.due : (tab === 'tasks' ? null : t), time: item ? item.time : '', remind: item ? !!item.remind : false };
  else form = { kind, id: item ? item.id : null, days: item ? [...item.days] : [0, 1, 2, 3, 4, 5, 6], time: item ? item.time : '', remind: item ? !!item.remind : false };
  const title = item ? item.title : '';
  let body = `<h3>${item ? 'Изменить' : 'Новая'} ${kind === 'task' ? 'задача' : 'привычка'}</h3>
    <input id="f-title" class="field" maxlength="120" placeholder="${kind === 'task' ? 'Что нужно сделать' : 'Например: зарядка'}" value="${esc(title)}">`;
  if (kind === 'task') {
    body += `<span class="lbl">Срок</span>
      <div class="chips" id="quick"><button class="chip" data-q="0">Сегодня</button><button class="chip" data-q="1">Завтра</button><button class="chip" data-q="7">Через неделю</button><button class="chip" data-q="x">Без срока</button></div>
      <div class="two" style="margin-top:10px"><input id="f-date" type="date" class="field" value="${form.due || ''}"><input id="f-time" type="time" class="field" value="${form.time || ''}"></div>`;
  } else {
    body += `<span class="lbl">Дни недели</span>
      <div class="chips" id="days">${WD.map((w, i) => `<button class="chip ${form.days.includes(i) ? 'on' : ''}" data-d="${i}">${w}</button>`).join('')}</div>
      <span class="lbl">Время напоминания</span><input id="f-time" type="time" class="field" value="${form.time || ''}">`;
  }
  body += `<label class="check"><input id="f-remind" type="checkbox" ${form.remind ? 'checked' : ''}>Напомнить в чат</label>
    <div class="actions">${item ? '<button class="btn del" data-act="del">Удалить</button>' : ''}<button class="btn" data-act="save">Сохранить</button></div>`;
  $('#sheet').innerHTML = body;
  $('#sheet').classList.add('open'); $('#shade').classList.add('open');
  syncQuick();
  if (!item) setTimeout(() => $('#f-title').focus(), 250);
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#shade').classList.remove('open'); form = null; }
function syncQuick() {
  if (!form || form.kind !== 'task') return;
  const t = today(), v = $('#f-date').value;
  document.querySelectorAll('#quick .chip').forEach(c => {
    const q = c.dataset.q;
    c.classList.toggle('on', q === 'x' ? !v : v === addDays(t, +q));
  });
}
function saveForm() {
  const title = $('#f-title').value.trim();
  if (!title) { $('#f-title').focus(); return; }
  const time = ($('#f-time').value || '');
  const remind = $('#f-remind').checked;
  if (form.kind === 'task') {
    const due = $('#f-date').value || null;
    if (form.id) Object.assign(S.tasks.find(x => x.id === form.id), { title, due, time: due ? time : '', remind });
    else S.tasks.push({ id: uid(), title, due, time: due ? time : '', remind, done: false, doneAt: null });
  } else {
    if (!form.days.length) return;
    const days = [...form.days].sort();
    if (form.id) Object.assign(S.habits.find(x => x.id === form.id), { title, days, time, remind });
    else S.habits.push({ id: uid(), title, days, time, remind, created: today(), log: {} });
  }
  persist(); closeSheet(); render(); buzz('medium');
}
function deleteForm() {
  if (!form || !form.id) return;
  const key = form.kind === 'task' ? 'tasks' : 'habits';
  S[key] = S[key].filter(x => x.id !== form.id);
  persist(); closeSheet(); render(); buzz('medium');
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (e.target.id === 'shade') return closeSheet();
  const q = e.target.closest('#quick .chip');
  if (q) { $('#f-date').value = q.dataset.q === 'x' ? '' : addDays(today(), +q.dataset.q); syncQuick(); return; }
  const dc = e.target.closest('#days .chip');
  if (dc) {
    const i = +dc.dataset.d, k = form.days.indexOf(i);
    k >= 0 ? form.days.splice(k, 1) : form.days.push(i);
    dc.classList.toggle('on'); return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id, act = a.dataset.act;
  if (act === 'add') return openSheet(tab === 'habits' ? 'habit' : 'task');
  if (act === 'save') return saveForm();
  if (act === 'del') return deleteForm();
  if (act === 'et') return openSheet('task', S.tasks.find(x => x.id === id));
  if (act === 'eh') return openSheet('habit', S.habits.find(x => x.id === id));
  if (act === 'tt') {
    const t = S.tasks.find(x => x.id === id);
    t.done = !t.done; t.doneAt = t.done ? today() : null;
  }
  if (act === 'th' || act === 'dh') {
    const h = S.habits.find(x => x.id === id), d = act === 'th' ? today() : a.dataset.date;
    if (h.log[d]) delete h.log[d]; else { h.log[d] = 1; if (d < h.created) h.created = d; }
  }
  buzz(); persist(); render();
});
document.addEventListener('input', e => { if (e.target.id === 'f-date') syncQuick(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'f-title') saveForm(); });

/* ---------- Старт ---------- */
(async () => { S = await loadData(); render(); })();
</script>
</body>
</html>
